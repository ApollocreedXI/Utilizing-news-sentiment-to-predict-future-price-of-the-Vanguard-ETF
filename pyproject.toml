[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "utilizing_news_sentiment_to_predict_future_price_of_the_vanguard_etf"
version = "0.0.1"
description = "The advent of neural networks has enabled the analysis of a large corpus of textual financial news headlines, an insurmountable task once infeasible. More specifically, extracting aggregated daily sentiment from new headlines is now possible using transformer-based neural network architectures. Utiliing these novel techiques, this project intents to expore how textual analysis alongside univariate price can be used in the financial markets for resource allocation and risk management."
authors = [
  { name = "Roydan Cruz" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.10.0"

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.isort]
profile = "black"
known_first_party = ["utilizing_news_sentiment_to_predict_future_price_of_the_vanguard_etf"]
force_sort_within_sections = true


